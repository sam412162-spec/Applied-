name: Claude PR Review

# Runs an automatic code review and security review on every pull request.
# Requires a repository secret named ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Applied, an Expo / React Native app
            (TypeScript, React Navigation) backed by Supabase, with Stripe payments.

            Focus on:
            1. Correctness bugs: broken logic, unhandled errors or loading states,
               async/await mistakes, null/undefined crashes.
            2. Supabase: queries that rely on the client for authorization,
               missing or weakened row-level security in supabase/schema.sql,
               service-role keys or secrets in client code.
            3. Payments: Stripe secret keys or payment logic that must run
               server-side but is in the app.
            4. React Native: unnecessary re-renders, large lists not virtualised,
               navigation params used without validation.
            5. TypeScript: `any`, unsafe casts, types that don't match the schema.

            Only report real problems. Use inline comments for specific lines
            and one short top-level summary comment. If nothing significant is
            found, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          exclude-directories: node_modules,assets
